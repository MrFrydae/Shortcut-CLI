[package]
name = "shortcut-cli"
version = "0.0.21"
edition = "2024"

[lib]
name = "shortcut_cli"
path = "src/lib.rs"

[[bin]]
name = "shortcut"
path = "src/main.rs"

[dependencies]
atty = "0.2.14"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
colored = "3.1.1"
dialoguer = "0.12.0"
progenitor-client = "0.13.0"
regress = "0.11.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rpassword = "7.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.50.0", features = ["full"] }
toon = "0.1.2"
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[build-dependencies]
openapiv3 = "2.2.0"
prettyplease = "0.2.37"
progenitor = { version = "0.13.0", default-features = false }
serde_json = "1.0.151"
syn = "2.0.119"
